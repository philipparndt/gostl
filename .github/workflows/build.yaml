name: build

on:
  push:
    branches:
      - main
      - swift
  pull_request:
    branches:
      - main
      - swift

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          # Use swift build which handles SPM packages directly
          swift build -c release --arch arm64

          # Ask SwiftPM where the products landed rather than assuming: the
          # layout moved from .build/<triple>/<config> to
          # .build/out/Products/<Config>, so a hard-coded path breaks as soon
          # as the runner's toolchain moves on.
          BIN=$(swift build -c release --arch arm64 --show-bin-path)
          echo "BIN=$BIN" >> "$GITHUB_ENV"

          # Compile Metal shaders into metallib
          xcrun -sdk macosx metal -c GoSTL-Swift/GoSTL/Resources/Shaders.metal -o .build/Shaders.air
          xcrun -sdk macosx metallib .build/Shaders.air -o .build/default.metallib

          # Create proper bundle structure
          mkdir -p "$BIN/GoSTL_GoSTL.bundle/Contents/Resources"
          cp .build/default.metallib "$BIN/GoSTL_GoSTL.bundle/Contents/Resources/"

      - name: Verify build output
        run: |
          file "$BIN/GoSTL"
          echo "Bundle contents:"
          find "$BIN/GoSTL_GoSTL.bundle" -type f
          echo "Checking metallib exists..."
          test -f "$BIN/GoSTL_GoSTL.bundle/Contents/Resources/default.metallib"
          echo "Build verified successfully"
